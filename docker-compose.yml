# JevMem local stack.
#   cp .env.example .env   # fill in keys (never commit .env)
#   docker compose up --build
#   open http://localhost:8000
#
# PostgreSQL instead of SQLite:
#   docker compose --profile postgres up --build
#   (and set DATABASE_URL=postgresql+psycopg://jevmem:jevmem@postgres:5432/jevmem in .env,
#    building with EXTRAS="--extra postgres")
services:
  jevmem:
    build:
      context: .
      args:
        EXTRAS: ${JEVMEM_EXTRAS:-}
    env_file: .env
    environment:
      DATA_DIR: /app/data
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: '["http://localhost:8000"]'
    ports:
      - "8000:8000"
    volumes:
      - jevmem-data:/app/data
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jevmem
      POSTGRES_PASSWORD: jevmem
      POSTGRES_DB: jevmem
    volumes:
      - jevmem-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jevmem"]
      interval: 5s
      retries: 10

volumes:
  jevmem-data:
  jevmem-pg:
