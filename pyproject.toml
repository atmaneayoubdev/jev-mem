[project]
name = "jevmem"
version = "0.1.0"
description = "Decision-native long-term memory for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "JevMem contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Benchmark reporting: charts + leakage probe.
bench = ["matplotlib>=3.8", "scikit-learn>=1.4"]
# Optional embedding / cross-encoder baselines. Not part of the core runtime.
embeddings = ["sentence-transformers>=3.0", "torch>=2.7"]

[project.scripts]
jevmem = "jevmem.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevmem"]

# Blackwell GPUs (sm_120) need CUDA 12.8 wheels; PyPI's default torch wheel on Windows is CPU-only.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
# Template families are data: long natural-language strings are clearer unwrapped.
"src/jevmem/benchmark/datasets/synthetic/families_*.py" = ["E501"]
# Typer declares options via call defaults.
"src/jevmem/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sklearn.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real Jev/Qwen endpoints (needs keys in .env)"]
addopts = "-m 'not live'"
